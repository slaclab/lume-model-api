# Protects the two contracts around webapp/backend.
#
#   drift    The frontend types in webapp/frontend/src/api/schema.d.ts are generated from
#            webapp/openapi.json, which is generated from the app. Both are committed, so
#            they go stale if someone edits a route or webapp/backend/schemas.py without
#            regenerating. Stale types mean a renamed field stops being a compile error.
#
#   contract /api/v1/* is called by notebooks and GUIs outside this repo. The drift check
#            passes happily when a v1 field is renamed, so tests/test_api_contract.py
#            asserts the v1 field names by hand.
#
# No model needed. Importing webapp.backend.main pulls in caproto and numpy only, because
# the model is built inside ModelPool worker subprocesses and app.openapi() never starts
# them. So no torch, no pytao, no Bmad lattice and no EPICS.

name: contract

on:
  pull_request:
  push:
    branches: [main] # otherwise a direct push to main runs no checks at all
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    # Actions are pinned to full-length commit SHAs because the slaclab org requires it.
    # A moving tag like @v4 can be repointed at new code, a SHA cannot. The trailing
    # comment is the human-readable version, so keep the two in step when bumping.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12' # matches ARG PYTHON_VERSION in webapp/Dockerfile

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20' # matches the node image in webapp/Dockerfile stage 1

      # The runtime dependency list lives in webapp/Dockerfile (the pip install near the
      # end of stage 2). This is a deliberate subset of it, just enough to import the app.
      # fastapi and pydantic are pinned because they generate the JSON schema, so an
      # unpinned upgrade would fail the drift check on unrelated pull requests. Bump these
      # on purpose, regenerate, and commit.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            fastapi==0.141.1 \
            pydantic==2.13.4 \
            sse-starlette \
            prometheus-client \
            pytest

      - name: External /api/v1 contract
        run: pytest -q

      - name: Regenerate the OpenAPI schema
        run: python webapp/scripts/dump_openapi.py

      - name: Regenerate the frontend types
        working-directory: webapp/frontend
        run: |
          npm ci
          npm run gen:api

      - name: Fail if a generated artifact is stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated contract artifacts are out of date. Run 'python webapp/scripts/dump_openapi.py' then 'cd webapp/frontend && npm run gen:api', and commit webapp/openapi.json plus webapp/frontend/src/api/schema.d.ts."
            exit 1
          fi

      # Deliberately last. This is what actually enforces "a backend rename is a frontend
      # compile error", but if someone also forgot to regenerate, the stale-artifact message
      # above is far more useful than an opaque tsc error, so let that one fire first.
      # `npm ci` already ran above. Writes only to gitignored dist/ and node_modules/.tmp/,
      # so it cannot disturb the check before it.
      - name: Typecheck the frontend against the regenerated types
        working-directory: webapp/frontend
        run: npm run build
