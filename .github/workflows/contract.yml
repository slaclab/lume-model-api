# Protects the two contracts this API owes its consumers.
#
#   drift    openapi.json is committed, and UI repos fetch it at a pinned ref to generate
#            their client types. It goes stale if someone edits a route or
#            lume_model_api/api/schemas.py without regenerating, and a stale schema means a
#            renamed field stops being a compile error in every downstream repo.
#
#   contract /api/v1/* is called by UIs, notebooks and GUIs in other repos. The drift check
#            passes happily when a v1 field is renamed, so tests/test_api_contract.py
#            asserts the v1 field names and route paths by hand.
#
# LUME_MODELS=demo selects the in-repo demo model: a light LUMEModel subclass that depends
# only on lume-base (from PyPI), so CI needs no torch, no pytao, no Bmad lattice and no
# EPICS. The demo model runs the same introspection, evaluate and serialization path as a
# real model, which means CI tests the whole pipeline rather than a stub.
#
# This guards the producer side only. Whether a consumer has picked up a schema change is
# enforced in that consumer's own CI, against the ref it pins.

name: contract

on:
  pull_request:
  push:
    branches: [main] # otherwise a direct push to main runs no checks at all
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      LUME_MODELS: demo
    # Actions are pinned to full-length commit SHAs because the slaclab org requires it.
    # A moving tag like @v4 can be repointed at new code, a SHA cannot. The trailing
    # comment is the human-readable version, so keep the two in step when bumping.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12' # matches ARG PYTHON_VERSION in the Dockerfile

      # The base install comes from pyproject.toml. fastapi and pydantic are pinned on top
      # because they generate the JSON schema, so an unpinned upgrade would fail the drift
      # check on unrelated pull requests. Bump these on purpose, regenerate, and commit.
      # The [epics] extra is deliberately omitted: pyepics is imported lazily by the live
      # role only, so CI never needs to build it.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" \
            fastapi==0.141.1 \
            pydantic==2.13.4

      - name: External /api/v1 contract
        run: pytest -q

      - name: Regenerate the OpenAPI schema
        run: python scripts/dump_openapi.py

      - name: Fail if openapi.json is out of date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::openapi.json is stale. Run 'python scripts/dump_openapi.py' and commit the result. Consumers generate their client types from this file."
            exit 1
          fi
