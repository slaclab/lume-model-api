[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lume-model-api"
version = "0.1.0"
description = "HTTP API that hosts any LUMEModel: introspection, evaluate and a live SSE stream"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic>=2",
    "prometheus-client",
    "numpy>=1.26",
    "scipy>=1.10",
    "lume-base>=0.5",
]

[project.optional-dependencies]
epics = ["pyepics>=3.5"]
dev = ["pytest", "httpx"]

# Bmad, pytao and the lattices need to be set up separately.
# virtual-accelerator declares its lume requirements without versions, so each one is pinned
# here. lume-bmad must be 0.1.1 or later, see the Dockerfile's beam check.
# virtual-accelerator requires lcls-cu-inj-model and facet2-inj-ml-model as git URLs with no
# commit, and they require distgen the same way. pip treats a pinned URL for one of those
# packages as a conflict, so they resolve to their default branch at build time and the
# Dockerfile prints what it got.
va = [
    "torch==2.15.0",
    "lume-base==0.6.0",
    "lume-cheetah==0.1.0",
    "lume-bmad==0.1.2",
    "virtual-accelerator[surrogate,bmad] @ git+https://github.com/slaclab/virtual-accelerator@9e656708ed6bc0a4cb8ff363677a4ccbd27333de",
]

[tool.setuptools.packages.find]
include = ["lume_model_api*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
