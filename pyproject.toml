[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lume-model-api"
version = "0.1.0"
description = "HTTP API that hosts any LUMEModel: introspection, evaluate and a live SSE stream"
readme = "README.md"
requires-python = ">=3.11"
# The single source of truth for the pip-installable dependencies. The Dockerfile and
# scripts/setup-dev-env.sh both `pip install -e .` rather than repeating this list.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic>=2",
    "prometheus-client",
    "numpy>=1.26",
    "scipy>=1.10",
    "lume-base>=0.5",
]

# A hosted model's own stack (torch, Bmad, pytao, virtual-accelerator) is deliberately absent.
# None of it is on PyPI at the revisions a real model needs, so it is pinned by git ref and
# conda channel in the Dockerfile and in scripts/setup-dev-env.sh. This package only ever
# imports a model through `model/loader.py`, inside a pool worker, which is why the demo
# model, the tests and app.openapi() all run without any of it.
[project.optional-dependencies]
epics = ["pyepics>=3.5"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["lume_model_api*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
