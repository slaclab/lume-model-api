[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lume-model-api"
version = "0.1.0"
description = "HTTP API that hosts any LUMEModel: introspection, evaluate and a live SSE stream"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic>=2",
    "prometheus-client",
    "numpy>=1.26",
    "scipy>=1.10",
    "lume-base>=0.5",
]

[project.optional-dependencies]
epics = ["pyepics>=3.5"]
dev = ["pytest", "httpx"]

# Bmad, pytao and the lattices need to be set up separately.
# lume-bmad must stay a git ref for now.
va = [
    "torch",
    "lume-base==0.6.0",
    "lume-torch==3.0.0",
    "lume-cheetah==0.1.0",
    "lume-bmad @ git+https://github.com/lume-science/lume-bmad@8f3ed201d546878441e06aced506fd4411c42492",
    "virtual-accelerator[surrogate,bmad] @ git+https://github.com/slaclab/virtual-accelerator@043a2f0fca3a8c7e1f837aa226a42a167a78f9fb",
]

[tool.setuptools.packages.find]
include = ["lume_model_api*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
