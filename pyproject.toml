[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lume-visualizations"
version = "0.1.0"
description = "Model/config/EPICS layer for the LCLS CU injector virtual accelerator (imported by the webapp live-stream monitor)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "caproto>=1.3",
    "numpy>=1.26",
    "pyepics>=3.5",
    "scipy>=1.10",
]
 # virtual-accelerator (torch/Bmad model) is installed separately in the webapp env/image.

[project.scripts]
lume-fake-epics-ioc = "lume_visualizations.fake_epics_ioc:main"

[tool.setuptools.packages.find]
include = ["lume_visualizations"]
namespaces = false
