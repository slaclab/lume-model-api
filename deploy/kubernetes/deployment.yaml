# Eval pool. Stateless: serves the SPA + /api/config + /api/evaluate + /api/v1/evaluate.
# EPICS-free (LUME_ROLE=eval, no EPICS configmap) so it scales freely.
# Baseline 2 for HA (avoids ~25-30s model-cold-start downtime on a single-pod restart).
# When KEDA is enabled (keda-scaledobject.yaml) its minReplicaCount governs and this
# field is only the pre-KEDA/initial value. Note: each replica requests ~5Gi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lume-monitor-eval
  namespace: lume-visualizations
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lume-monitor-eval
  template:
    metadata:
      labels:
        app: lume-monitor-eval
    spec:
      containers:
        - name: lume-monitor
          # Tag is pinned via kustomization.yaml `images:` (immutable per test).
          image: ghcr.io/slaclab/lume-monitor
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: LUME_ROLE
              value: "eval"
            - name: LCLS_LATTICE
              value: /opt/lcls-lattice
            - name: KMP_DUPLICATE_LIB_OK
              value: "TRUE"
            # In-pod subprocess pool: K model instances (each ~2 GB) run K evaluates
            # in parallel. Size memory/cpu for K.
            - name: LUME_POOL_WORKERS
              value: "2"
            - name: LUME_MAX_INFLIGHT
              value: "8"
            - name: LUME_WORKER_THREADS
              value: "2"
          # No EPICS configmap: the eval pool never touches Channel Access.
          resources:
            requests:
              cpu: "2"
              memory: 5Gi
            limits:
              cpu: "4"
              memory: 7Gi
          # Model init (~25-30s): allow generous startup before readiness.
          startupProbe:
            httpGet:
              path: /api/config
              port: 8000
            periodSeconds: 5
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /api/config
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/config
              port: 8000
            periodSeconds: 30
