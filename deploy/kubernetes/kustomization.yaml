apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lume-visualizations
resources:
  - namespace.yaml
  - configmap-epics.yaml
  - deployment.yaml
  - deployment-live.yaml
  - service.yaml
  - ingress.yaml
  - ingress-redirect.yaml
# NOTE: keda-scaledobject.yaml (eval-pool autoscaling) is intentionally NOT listed —
# it needs KEDA installed + site-specific values. Apply it separately once ready.

# Pin the image tag for a reproducible test. Bump newTag when you push a new image.
images:
  - name: ghcr.io/slaclab/lume-monitor
    newTag: n6
