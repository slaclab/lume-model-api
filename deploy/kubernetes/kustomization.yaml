apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lume-model-api
resources:
  - namespace.yaml
  - deployment.yaml
  - deployment-live.yaml
  - service.yaml
  - ingress.yaml

# SOURCE OF TRUTH for LUME_MODELS: the models both pools host, keyed by the URL name each
# answers on at /api/v1/models/<name>/... . Edit here. Both Deployments read it from this
# ConfigMap so eval and live cannot drift. A model served by the eval pool but not the live
# pod would have no live stream; a model in live but not eval would have no evaluate route.
# Add a key to host a second model in the same process, with its own optional "workers",
# "kwargs" and "max_inflight". The value is JSON inside a YAML string, so keep the outer
# single quotes.
#
# Memory scales with the SUM of workers across models, at roughly 2 GB per real model
# worker, so adding a model means raising requests and limits in both Deployments.
#
# Kustomize appends a content hash to the ConfigMap name and rewrites both references, so
# changing the value rolls both Deployments on the next apply.
configMapGenerator:
  - name: lume-model-api-models
    literals:
      - 'LUME_MODELS={"cu_hxr_staged": {"kwargs": {"n_particles": 1000, "end_element": "OTR3"}}}'

# Pin the image tag for a reproducible test. Bump newTag when you push a new image.
# Nothing in CI builds the image, so build and push one before changing this. The dev
# cluster runs the `dev` tag.
# Everything here is named lume-model-api-* in its own lume-model-api namespace, and serves
# the /lume-model-api prefix, so applying it touches nothing the old monolith owns. The old
# lume-monitor-* objects keep serving /live-monitor from lume-visualizations until the UI is
# ported, and are deleted at the cut-over. See docs/maintainer/DEPLOY.md.
images:
  - name: ghcr.io/slaclab/lume-model-api
    newTag: dev
