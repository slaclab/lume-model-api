# Two Services: the Ingress routes live/snapshot to the singleton, the rest to the
# eval pool. Both forward 80 -> 8000.
apiVersion: v1
kind: Service
metadata:
  name: lume-model-api-eval
  namespace: lume-model-api
spec:
  selector:
    app: lume-model-api-eval
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: lume-model-api-live
  namespace: lume-model-api
spec:
  selector:
    app: lume-model-api-live
  ports:
    - name: http
      port: 80
      targetPort: 8000
