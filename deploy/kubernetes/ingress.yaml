# One host/path for everyone → one Service. No per-worker wN paths.
# SSE needs a long read timeout and no response buffering.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lume-monitor
  namespace: lume-visualizations
  annotations:
    # Strip the /live-monitor prefix so the backend (served at "/") matches.
    # base:'./' + API_BASE='.' keeps the SPA + /api calls relative under the subpath.
    # Load the app at the trailing-slash URL: .../live-monitor/
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Internal-only exposure gate (same ranges as the prior marimo ingress).
    # Remove/adjust when the service is intended to go public.
    nginx.ingress.kubernetes.io/whitelist-source-range: "71.198.255.25,134.79.0.0/16,172.16.0.0/12,208.45.173.162,216.46.165.69,172.27.8.0/24"
spec:
  ingressClassName: nginx
  rules:
    - host: ard-modeling-service.slac.stanford.edu
      http:
        paths:
          - path: /live-monitor(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: lume-monitor
                port:
                  number: 80
