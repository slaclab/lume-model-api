# One host/path for everyone → one Service. No per-worker wN paths.
# SSE needs a long read timeout and no response buffering.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lume-monitor
  namespace: lume-visualizations
  annotations:
    # Strip the /lume-monitor prefix so the backend (served at "/") matches.
    # base:'./' + API_BASE='.' keeps the SPA + /api calls relative under the subpath.
    # Load the app at the trailing-slash URL: .../lume-monitor/
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: ard-modeling-service.slac.stanford.edu
      http:
        paths:
          - path: /lume-monitor(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: lume-monitor
                port:
                  number: 80
