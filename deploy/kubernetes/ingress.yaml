# One host, two backends. The EPICS-touching endpoints (SSE live stream +
# machine-snapshot) go to the singleton live producer; everything else (SPA,
# /api/config, /api/evaluate) goes to the autoscalable eval pool.
#
# Both paths share the rewrite-target /$2, so each regex must capture the remainder
# (after /live-monitor/) in group 2. nginx orders regex locations by descending path
# length, so the longer live path is matched before the catch-all.
#
# SSE needs a long read timeout and no response buffering.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lume-monitor
  namespace: lume-visualizations
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Internal-only exposure gate (same ranges as the prior marimo ingress).
    # Remove/adjust when the service is intended to go public.
    nginx.ingress.kubernetes.io/whitelist-source-range: "71.198.255.25,134.79.0.0/16,172.16.0.0/12,208.45.173.162,216.46.165.69,172.27.8.0/24"
spec:
  ingressClassName: nginx
  rules:
    - host: ard-modeling-service.slac.stanford.edu
      http:
        paths:
          # EPICS-touching endpoints -> live producer (singleton).
          - path: /live-monitor(/)(api/live/.*|api/machine-snapshot)
            pathType: ImplementationSpecific
            backend:
              service:
                name: lume-monitor-live
                port:
                  number: 80
          # Everything else (SPA, config, evaluate) -> eval pool.
          - path: /live-monitor(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: lume-monitor-eval
                port:
                  number: 80
